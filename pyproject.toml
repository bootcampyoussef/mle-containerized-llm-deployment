[project]
name = "mle-containerized-llm-deployment"
version = "0.1.0"
requires-python = ">=3.13.17"
dependencies = [
    "fastapi>=0.161.1",
    "httpx>=0.28.1",
    "openai>=3.37.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
    "rumdl>=0.3.0",
    "ty>=0.0.91",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"

[tool.rumdl]
disable = ["MD013"]

[tool.uv]
required-version = ">=0.13.5"
# Apply certificate fixes without adding unused runtime packages.
constraint-dependencies = ["certifi>=2026.10.19", "pip>=26.2.2"]
